<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="T3 Code talks to the commandcode ACP process over JSON-RPC on stdio, which uses your existing subscription login">
  <title>How the pieces connect</title>
  <defs>
    <linearGradient id="boxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161e"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.12"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.12"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5eead4" fill-opacity="0.85"/>
    </marker>
  </defs>

  <rect width="1280" height="320" fill="#08090c"/>

  <text x="56" y="52" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="23" font-weight="600" fill="#e8ebf2" letter-spacing="-0.4">How the pieces connect</text>
  <text x="56" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"
        font-size="13.5" fill="#8d97a8">One long-lived process. No proxy, no forwarded port, no background service.</text>

  <g>
    <rect x="56" y="140" width="280" height="92" rx="12" fill="url(#boxTop)" stroke="#202838"/>
    <text x="80" y="168" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#6f7a8c" letter-spacing="1.3">APP</text>
    <text x="80" y="199" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="18" fill="#e8ebf2">T3 Code</text>
    <text x="80" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8d97a8">spawns the agent once</text>
  </g>

  <path d="M348 186H488" stroke="url(#lineGrad)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="418" y="164" text-anchor="middle" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="12" fill="#5eead4">ACP</text>
  <text x="418" y="216" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#6f7a8c">JSON-RPC / stdio</text>

  <g>
    <rect x="500" y="140" width="280" height="92" rx="12" fill="url(#boxTop)" stroke="#2a3448"/>
    <text x="524" y="168" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#6f7a8c" letter-spacing="1.3">PROCESS</text>
    <text x="524" y="199" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="18" fill="#e8ebf2">commandcode acp</text>
    <text x="524" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8d97a8">initialize + session/new</text>
  </g>

  <path d="M792 186H932" stroke="url(#lineGrad)" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="862" y="164" text-anchor="middle" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="12" fill="#5eead4">auth</text>
  <text x="862" y="216" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#6f7a8c">reuses your login</text>

  <g>
    <rect x="944" y="140" width="280" height="92" rx="12" fill="url(#boxTop)" stroke="#202838"/>
    <text x="968" y="168" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5" fill="#6f7a8c" letter-spacing="1.3">ACCOUNT</text>
    <text x="968" y="199" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="18" fill="#e8ebf2">your subscription</text>
    <text x="968" y="219" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#8d97a8">~/.commandcode/auth.json</text>
  </g>

  <path d="M56 268H1224" stroke="#171c27"/>

  <g font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="12">
    <text x="56" y="298" fill="#7f8899">turn 1</text>
    <text x="116" y="298" fill="#b7c0cf">session/prompt</text>
    <text x="236" y="298" fill="#3d4656">-</text>
    <text x="252" y="298" fill="#b7c0cf">streamed updates</text>
    <text x="388" y="298" fill="#3d4656">-</text>
    <text x="404" y="298" fill="#b7c0cf">tool calls</text>
    <text x="492" y="298" fill="#3d4656">-</text>
    <text x="508" y="298" fill="#b7c0cf">permission modes</text>
  </g>
</svg>
