<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="The T3 Code model picker with Command Code selected as the provider and deepseek/deepseek-v4.1-flash as the model">
  <title>Model picker</title>
  <defs>
    <linearGradient id="menuBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12161e"/>
      <stop offset="1" stop-color="#0e1118"/>
    </linearGradient>
  </defs>

  <rect width="900" height="460" fill="#08090c"/>

  <text x="40" y="46" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="15" font-weight="600" fill="#e8ebf2">Open the model picker</text>
  <text x="40" y="70" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"
        font-size="13" fill="#8d97a8">Command Code sits next to your other providers — nothing special to remember.</text>

  <rect x="40" y="96" width="400" height="330" rx="12" fill="url(#menuBg)" stroke="#232b3b"/>

  <text x="64" y="128" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5"
        fill="#6f7a8c" letter-spacing="1.2">PROVIDER</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="14">
    <rect x="52" y="142" width="376" height="38" rx="8" fill="#0e1118"/>
    <circle cx="74" cy="161" r="4" fill="#4b5566"/>
    <text x="90" y="166" fill="#9aa4b5">Claude</text>

    <rect x="52" y="186" width="376" height="38" rx="8" fill="#0e1118"/>
    <circle cx="74" cy="205" r="4" fill="#4b5566"/>
    <text x="90" y="210" fill="#9aa4b5">Codex</text>

    <rect x="52" y="230" width="376" height="38" rx="8" fill="#0e1118"/>
    <circle cx="74" cy="249" r="4" fill="#4b5566"/>
    <text x="90" y="254" fill="#9aa4b5">Cursor</text>

    <rect x="44" y="274" width="392" height="46" rx="9" fill="#14251f" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <rect x="44" y="274" width="3" height="46" rx="1.5" fill="#5eead4"/>
    <circle cx="74" cy="297" r="5" fill="#5eead4"/>
    <text x="90" y="303" font-weight="600" fill="#e8ebf2">Command Code</text>
    <rect x="318" y="284" width="106" height="26" rx="13" fill="#0f3b35" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <text x="371" y="301" text-anchor="middle" font-family="'SF Mono',ui-monospace,Menlo,monospace"
          font-size="10.5" fill="#5eead4">acpRegistry</text>

    <rect x="52" y="328" width="376" height="38" rx="8" fill="#0e1118"/>
    <circle cx="74" cy="347" r="4" fill="#4b5566"/>
    <text x="90" y="352" fill="#9aa4b5">Local ACP</text>
  </g>

  <path d="M40 380h400" stroke="#1a2030"/>
  <text x="64" y="404" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5"
        fill="#6f7a8c" letter-spacing="1.2">MODEL · 98 AVAILABLE</text>

  <rect x="480" y="96" width="380" height="330" rx="12" fill="url(#menuBg)" stroke="#232b3b"/>
  <text x="504" y="128" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="10.5"
        fill="#6f7a8c" letter-spacing="1.2">MODEL</text>

  <rect x="492" y="142" width="356" height="52" rx="9" fill="#14251f" stroke="#2dd4bf" stroke-opacity="0.5"/>
  <path d="M512 168l5 5 9-9" stroke="#5eead4" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="538" y="164" font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="13.5" fill="#e8ebf2">deepseek/deepseek-v4.1-flash</text>
  <text x="538" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" font-size="11.5" fill="#6f7a8c">default · 1M context</text>

  <g font-family="'SF Mono',ui-monospace,Menlo,monospace" font-size="13">
    <text x="504" y="228" fill="#b7c0cf">deepseek/deepseek-v4.1</text>
    <text x="504" y="262" fill="#b7c0cf">deepseek/deepseek-reasoner</text>
    <text x="504" y="296" fill="#b7c0cf">qwen/qwen3-coder-480b</text>
    <text x="504" y="330" fill="#b7c0cf">glm/glm-4.6</text>
    <text x="504" y="364" fill="#6f7a8c">kimi/kimi-k2-thinking</text>
    <text x="504" y="398" fill="#4b5566">+ 92 more</text>
  </g>
</svg>
